<div class="bg-smoke" aria-hidden="true">

      <radialGradient id="smokeFade" cx="50%" cy="42%" r="62%">

      <filter id="smokeWisp" x="-30%" y="-30%" width="160%" height="160%">

        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="230"

        <feGaussianBlur stdDeviation="7"/>
      </filter>
    </defs>
    <g filter="url(#smokeWisp)">
      <ellipse class="plume p1" cx="30%" cy="28%" rx="24%" ry="40%" fill="url(#smokeFade)"/>
      <ellipse class="plume p2" cx="72%" cy="40%" rx="22%" ry="42%" fill="url(#smokeFade)"/>
      <ellipse class="plume p3" cx="48%" cy="68%" rx="28%" ry="44%" fill="url(#smokeFade)"/>

                  numOctaves="2" seed="7" stitchTiles="stitch" result="n"/>
    <feGaussianBlur in="n" stdDeviation="1.2" result="nb"/>
