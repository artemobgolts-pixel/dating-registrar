<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{ u['display_name'] or 'Профиль' }} · date4you</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♥</text></svg>">
<link rel="stylesheet" href="/static/public.css">
<style>
  .prof { max-width: 460px; margin: 0 auto; padding: 48px 22px 80px; text-align: center; }
  .prof .back { display: inline-block; margin-bottom: 26px; color: #b65f6f; text-decoration: none; }
  .prof .ava { width: 132px; height: 132px; border-radius: 50%; object-fit: cover;
    border: 3px solid #e7d3d7; margin: 0 auto 18px; display: block; }
  .prof .ava-ph { width: 132px; height: 132px; border-radius: 50%; margin: 0 auto 18px;
    display: grid; place-items: center; background: #f3e6e9; font-size: 56px; }
  .prof h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 32px;
    color: #b65f6f; margin: 0 0 6px; }
  .prof .meta { color: #6b545a; font-size: 15px; line-height: 1.9; }
  .prof .meta .row { display: inline-block; margin: 0 8px; }
  .prof .me-edit { margin-top: 22px; }
</style>
</head>
<body>
<main class="prof">
  <a class="back" href="/admin/">← в кабинет</a>
  {% if u['avatar_path'] %}
    <img class="ava" src="/u/{{ u['id'] }}/avatar" alt="Фото профиля" width="132" height="132">
  {% else %}
    <div class="ava-ph" aria-hidden="true">🙂</div>
  {% endif %}
  <h1>{{ u['display_name'] or 'Без имени' }}</h1>
  <div class="meta">
    {% if u['gender'] == 'm' %}<span class="row">Мужской</span>
    {% elif u['gender'] == 'f' %}<span class="row">Женский</span>{% endif %}
    {% if u['birth_date'] %}<span class="row">🎂 {{ u['birth_date'] }}</span>{% endif %}
  </div>
  {% if is_me %}
    <div class="me-edit"><a class="btn ghost" href="/admin/profile">Редактировать профиль</a></div>
  {% endif %}
</main>
</body>
</html>
