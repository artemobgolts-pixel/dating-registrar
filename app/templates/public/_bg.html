{# Фон «растекающиеся чернила» — общий для гостевой, входа, /about и юр-страниц.
   Видимый слой — WebGL-шейдер (/static/ink.js); CSS-дым ниже — фолбэк без WebGL2.
   Операторская админка намеренно его НЕ подключает (простой функциональный UI). #}
<div class="bg-smoke" aria-hidden="true">
  <svg class="turb" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <defs>
      <radialGradient id="smokeFade" cx="50%" cy="42%" r="62%">
        <stop offset="0%" stop-color="#b65f6f" stop-opacity="0.55"/>
        <stop offset="55%" stop-color="#cf7d92" stop-opacity="0.32"/>
        <stop offset="100%" stop-color="#cf7d92" stop-opacity="0"/>
      </radialGradient>
      <filter id="smokeWisp" x="-30%" y="-30%" width="160%" height="160%">
        <feTurbulence type="fractalNoise" baseFrequency="0.006 0.011" numOctaves="4"
                      seed="11" stitchTiles="stitch" result="noise">
          <animate attributeName="baseFrequency" dur="42s"
                   values="0.006 0.011;0.008 0.014;0.006 0.011" repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="230"
                           xChannelSelector="R" yChannelSelector="G"/>
        <feGaussianBlur stdDeviation="7"/>
      </filter>
    </defs>
    <g filter="url(#smokeWisp)">
      <ellipse class="plume p1" cx="30%" cy="28%" rx="24%" ry="40%" fill="url(#smokeFade)"/>
      <ellipse class="plume p2" cx="72%" cy="40%" rx="22%" ry="42%" fill="url(#smokeFade)"/>
      <ellipse class="plume p3" cx="48%" cy="68%" rx="28%" ry="44%" fill="url(#smokeFade)"/>
    </g>
  </svg>
  <span></span><span></span><span></span>
</div>
