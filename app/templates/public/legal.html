<!doctype html>
<html lang="ru" data-skin="friends">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% if doc == 'terms' %}Пользовательское соглашение{% else %}Политика конфиденциальности{% endif %} · date4you</title>
{% from "_appearance_assets.html" import appearance_assets %}
{{ appearance_assets('friends') }}
<meta name="theme-color" content="#554eae">
<script src="{{ asset('theme.js') }}"></script>
<link rel="stylesheet" href="{{ asset('public.css') }}">
<style>
  .legal { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 40px 22px 80px; }
  .legal h1 { font-family: var(--serif); font-size: 34px; color: var(--rose); margin: 0 0 6px; }
  .legal .upd { color: var(--muted); font-size: 13px; margin: 0 0 26px; }
  .legal h2 { font-size: 19px; color: var(--rose-2); margin: 28px 0 8px; }
  .legal p, .legal li { line-height: 1.6; color: var(--ink); font-size: 15px; }
  .legal ul { padding-left: 22px; }
  .legal a { color: var(--rose); }
  .legal .back { display: inline-block; margin-bottom: 22px; color: var(--rose); text-decoration: none; }
</style>
</head>
<body data-ink-interactive="{{ '1' if request.state.user and request.state.user['cursor_effects'] else '0' }}">
{% include "public/_bg.html" %}
<main class="legal">
  <a class="back" href="{{ back_url | default('/admin/' if request.state.user else '/login', true) }}">← Вернуться</a>
{% if doc == 'terms' %}
  {% include "public/_terms.html" %}
{% else %}
  {% include "public/_privacy.html" %}
{% endif %}
</main>
<script src="{{ asset('ink.js') }}"
        data-runtime-src="{{ asset('ink-runtime.js') }}"
        data-worker-src="{{ asset('ink-worker.js') }}"
        data-static-friends-light="{{ asset('ink-static-friends-light.webp') }}"
        data-static-friends-light-portrait="{{ asset('ink-static-friends-light-portrait.webp') }}"
        data-static-friends-dark="{{ asset('ink-static-friends-dark.webp') }}"
        data-static-romantic-light="{{ asset('ink-static-romantic-light.webp') }}"
        data-static-romantic-dark="{{ asset('ink-static-romantic-dark.webp') }}"
        defer></script>
</body>
</html>
