<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% if doc == 'terms' %}Пользовательское соглашение{% else %}Политика конфиденциальности{% endif %} · date4you</title>
<link rel="icon" data-skin-asset
      data-href-friends="{{ asset('logo-standard.png') }}"
      data-href-romantic="{{ asset('logo-romantic.png') }}"
      href="{{ asset('logo-romantic.png') }}">
<meta name="theme-color" content="#b65f6f">
<script src="{{ asset('theme.js') }}"></script>
<link rel="stylesheet" href="{{ asset('public.css') }}">
<style>
  .legal { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 40px 22px 80px; }
  .legal h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 34px; color: #b65f6f; margin: 0 0 6px; }
  .legal .upd { color: #9a8; font-size: 13px; margin: 0 0 26px; }
  .legal h2 { font-size: 19px; color: #8f4a58; margin: 28px 0 8px; }
  .legal p, .legal li { line-height: 1.6; color: #4a3a3d; font-size: 15px; }
  .legal ul { padding-left: 22px; }
  .legal a { color: #b65f6f; }
  .legal .back { display: inline-block; margin-bottom: 22px; color: #b65f6f; text-decoration: none; }
</style>
</head>
<body data-ink-interactive="{{ '1' if request.state.user and request.state.user['cursor_effects'] else '0' }}">
{% include "public/_bg.html" %}
<main class="legal">
  <a class="back" href="/">← на главную</a>
{% if doc == 'terms' %}
  {% include "public/_terms.html" %}
{% else %}
  {% include "public/_privacy.html" %}
{% endif %}
</main>
<script src="{{ asset('ink.js') }}" defer></script>
</body>
</html>
