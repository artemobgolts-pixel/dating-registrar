{% extends "admin/base.html" %}
{% block title %}Новая категория{% endblock %}
{% block content %}
<a class="btn editor-back category-new-back" href="/admin/categories">← Назад</a>
<div class="bar">
  <h1 class="serif" style="margin:0">Новая категория</h1>
</div>

<div class="card category-new-card">
  <form method="post" action="/admin/categories/create" class="category-new-form">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label class="field">
      <span class="field-label">Название<sup class="required-mark" aria-hidden="true">*</sup></span>
      <input type="text" name="name" maxlength="200"
             placeholder="Например, Летние планы" required autofocus>
    </label>
    <label class="field">
      <span class="field-label">Сколько вариантов сможет выбрать участник<sup class="required-mark" aria-hidden="true">*</sup></span>
      <select name="choice_mode" required>
        <option value="single">Один вариант</option>
        <option value="multiple">Несколько вариантов</option>
      </select>
    </label>
    <div class="field deadline-picker" data-deadline-picker>
      <label class="field-label" for="newVotingDeadline">Дедлайн голосования<sup class="required-mark" aria-hidden="true">*</sup></label>
      <input type="datetime-local" name="voting_deadline" id="newVotingDeadline"
             min="{{ deadline_min }}" value="{{ default_deadline }}" required data-picker-only>
      <div class="deadline-presets" aria-label="Быстрый выбор дедлайна">
        <span>Быстро:</span>
        <button type="button" class="deadline-preset" data-deadline-hours="3" aria-pressed="false">+3 часа</button>
        <button type="button" class="deadline-preset" data-deadline-hours="24" aria-pressed="false">Завтра</button>
        <button type="button" class="deadline-preset" data-deadline-hours="72" aria-pressed="false">Через 3 дня</button>
        <button type="button" class="deadline-preset" data-deadline-hours="168" aria-pressed="false">Через неделю</button>
      </div>
      <small class="deadline-readable" data-deadline-readable aria-live="polite"></small>
      <small class="muted">Его всегда можно изменить в редакторе категории.</small>
    </div>
    <div class="category-new-actions">
      <button class="btn primary" type="submit">Создать категорию</button>
      <a class="btn ghost" href="/admin/categories">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
