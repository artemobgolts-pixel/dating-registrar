<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Кабинет{% endblock %} · date4you</title>
<link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;text y='80' font-size='80'&gt;%E2%9D%A4&lt;/text&gt;&lt;/svg&gt;">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/admin.css">
</head>
<body data-csrf="{{ csrf }}">
<!-- Спокойный тёплый фон редактора: статичный градиент в палитре (как в макетах).
     Тяжёлый WebGL-фон гостевой здесь не нужен — он мешал бы заполнять форму. -->
<div class="bg-warm" aria-hidden="true"></div>

<!-- Фильтр преломления для «жидкого стекла» карточек (backdrop-filter: url).
     Тот же, что на гостевой; чистый SVG без скриптов — под нашу CSP. -->
<svg class="glass-defs" aria-hidden="true" focusable="false" width="0" height="0">
  <filter id="glassWarp" x="-20%" y="-20%" width="140%" height="140%"
          color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.011 0.013"
                  numOctaves="2" seed="7" stitchTiles="stitch" result="n"/>
    <feGaussianBlur in="n" stdDeviation="1.2" result="nb"/>
    <feDisplacementMap in="SourceGraphic" in2="nb" scale="22"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<header class="top">
  <a class="brand serif" href="/admin/">♥ date4you</a>
  <nav>
    <a href="/admin/" class="{{ 'on' if active == 'dash' else '' }}">Главная</a>
    <a href="/admin/categories" class="{{ 'on' if active == 'cats' else '' }}">Категории</a>
    <a href="/admin/dates" class="{{ 'on' if active == 'dates' else '' }}">Свидания</a>
    <a href="/admin/questions" class="{{ 'on' if active == 'q' else '' }}">Вопросы{% if unread %} <span class="pill">{{ unread }}</span>{% endif %}</a>
    <form class="inline" method="post" action="/admin/logout">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="linklike exit">Выйти</button>
    </form>
  </nav>
</header>
<main class="wrap">
{% set m = request.query_params.get('msg') %}
{% if m %}<div class="flash{{ ' err' if m.startswith('⚠') else '' }}">{{ m }}</div>{% endif %}
{% block content %}{% endblock %}
</main>
<script src="/static/ui.js"></script>
<script nonce="{{ csp_nonce }}">
function copyText(t, btn) {
  navigator.clipboard.writeText(t).then(function () {
    var o = btn.textContent;
    btn.textContent = 'Скопировано ✓';
    setTimeout(function () { btn.textContent = o; }, 1500);
  });
}
/* CSP без 'unsafe-inline': бывшие inline-обработчики — через делегирование */
document.addEventListener('submit', function (e) {
  var msg = e.target.getAttribute('data-confirm');
  if (msg && !confirm(msg)) e.preventDefault();
});
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-copy]');
  if (b) copyText(b.getAttribute('data-copy'), b);
});
document.addEventListener('change', function (e) {
  if (e.target.matches('[data-autosubmit]')) e.target.form.submit();
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
