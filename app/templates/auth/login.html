<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Вход · date4you</title>
<link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;text y='80' font-size='80'&gt;%E2%9D%A4&lt;/text&gt;&lt;/svg&gt;">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#b65f6f">
<link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <h1>♥</h1>
    <p class="login-lead">Войди, чтобы собрать свою подборку свиданий.</p>
    {% if not bot %}
      <div class="err">Вход через Telegram пока не настроен.</div>
    {% else %}
      <button id="tg-login" class="btn primary" style="width:100%">Войти через Telegram</button>
      <p id="tg-hint" class="login-hint" hidden>
        Открой бота, нажми <b>Start</b> — и вернись на эту вкладку.
        <a id="tg-link" href="#" target="_blank" rel="noopener">Открыть бота ещё раз</a>
      </p>
      <div id="tg-error" class="err" hidden></div>
    {% endif %}
  </div>
</div>
<script nonce="{{ csp_nonce }}" src="/static/auth.js"></script>
</body>
</html>
