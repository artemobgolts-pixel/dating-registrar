name: tests

# Gate связывает полный suite, browser/runtime и образ с точным чистым SHA.
on:
  push:
  pull_request:

jobs:
  smoke:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -c app/constraints.txt -r app/requirements.txt -r app/requirements-test.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Chromium for browser regressions
        run: python -m playwright install --with-deps chromium

      - name: Run exact SHA release gate
        run: python scripts/release_gate.py --sha "$GITHUB_SHA" --mode release --output artifacts/release-gate

      - name: Build retained artifact and run disposable image drill
        run: |
          receipt=$(find artifacts/release-gate -name receipt.json -type f)
          test "$(printf '%s\n' "$receipt" | wc -l)" -eq 1
          python scripts/release.py prepare --sha "$GITHUB_SHA" --receipt "$receipt"

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-${{ github.sha }}
          path: artifacts/release-gate/
          retention-days: 14

      - name: Upload retained release images
        uses: actions/upload-artifact@v4
        with:
          name: release-images-${{ github.sha }}
          path: .release/artifacts/
          include-hidden-files: true
          retention-days: 14
