name: tests

# Каждый unittest-модуль запускается в отдельном процессе: тесты намеренно
# подменяют DATA_DIR/SECRET_KEY до импорта приложения и не должны делить
# module cache или окружение. Большой smoke-сценарий остаётся отдельным gate.
on:
  push:
  pull_request:

jobs:
  smoke:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install -r app/requirements-test.txt

      - name: Install Chromium for browser regressions
        run: python -m playwright install --with-deps chromium

      - name: Run isolated regression suites
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          for test in tests/test_*.py; do
            case "$test" in
              tests/test_ink.py|tests/test_smoke.py) continue ;;
            esac
            echo "::group::$test"
            python "$test"
            echo "::endgroup::"
          done

      - name: Run smoke tests
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python tests/test_smoke.py
